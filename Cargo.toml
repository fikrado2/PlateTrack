[package]
name = "platetrack"
version = "1.0.0"
edition = "2021"
authors = ["Fikrado Security"]
description = "Windows desktop app for license plate recognition using the Plate Recognizer API"
license = "MIT"
repository = "https://github.com/fikrado2/PlateTrack"
keywords = ["license-plate", "ocr", "egui", "windows", "desktop"]
rust-version = "1.77"

[[bin]]
name = "platetrack"
path = "src/main.rs"

[lib]
name = "platetrack"
path = "src/lib.rs"

[dependencies]
# GUI – egui/eframe is the most mature fully-native Rust GUI framework
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.29"

# Storage
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Networking
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart", "blocking"] }

# Image processing
image = "0.25"

# Utilities
anyhow = "1.0"
thiserror = "2.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4"] }
directories = "5.0"
parking_lot = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
once_cell = "1.20"
csv = "1.3"

# Native file dialogs for Windows
rfd = "0.14"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
